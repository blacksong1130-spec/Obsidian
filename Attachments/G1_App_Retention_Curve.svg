<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="860" height="420" fill="#FAFAFA" rx="4"/>
  <!-- Title -->
  <text x="430" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#2C3E50">G1 — Health &amp; Fitness App Retention Curve</text>
  <!-- Y-axis gridlines -->
  <line x1="80" y1="50" x2="820" y2="50" stroke="#E5E5E5" stroke-dasharray="5,4"/>
  <line x1="80" y1="106" x2="820" y2="106" stroke="#E5E5E5" stroke-dasharray="5,4"/>
  <line x1="80" y1="162" x2="820" y2="162" stroke="#E5E5E5" stroke-dasharray="5,4"/>
  <line x1="80" y1="218" x2="820" y2="218" stroke="#E5E5E5" stroke-dasharray="5,4"/>
  <line x1="80" y1="274" x2="820" y2="274" stroke="#E5E5E5" stroke-dasharray="5,4"/>
  <!-- Y-axis labels -->
  <text x="72" y="54" text-anchor="end" font-size="11" fill="#666">100%</text>
  <text x="72" y="110" text-anchor="end" font-size="11" fill="#666">80%</text>
  <text x="72" y="166" text-anchor="end" font-size="11" fill="#666">60%</text>
  <text x="72" y="222" text-anchor="end" font-size="11" fill="#666">40%</text>
  <text x="72" y="278" text-anchor="end" font-size="11" fill="#666">20%</text>
  <text x="72" y="334" text-anchor="end" font-size="11" fill="#666">0%</text>
  <!-- Y-axis rotated label -->
  <text transform="rotate(-90)" x="-190" y="24" text-anchor="middle" font-size="12" fill="#444">Retention Rate (%)</text>
  <!-- Area fill: Day0(80,50) Day1(105,257) Day7(253,288) Day14(425,308) Day28(771,319) Day30(820,322) -->
  <path d="M 80,50 L 105,257 L 253,288 L 425,308 L 771,319 L 820,322 L 820,330 L 80,330 Z" fill="rgba(192,57,43,0.12)"/>
  <!-- Line -->
  <polyline points="80,50 105,257 253,288 425,308 771,319 820,322" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Data point circles -->
  <circle cx="80" cy="50" r="5" fill="#C0392B"/>
  <circle cx="105" cy="257" r="5" fill="#C0392B"/>
  <circle cx="253" cy="288" r="5" fill="#C0392B"/>
  <circle cx="425" cy="308" r="5" fill="#C0392B"/>
  <circle cx="771" cy="319" r="5" fill="#C0392B"/>
  <circle cx="820" cy="322" r="5" fill="#C0392B"/>
  <!-- Data labels -->
  <text x="80" y="42" text-anchor="middle" font-size="11" font-weight="bold" fill="#C0392B">100%</text>
  <text x="108" y="249" text-anchor="start" font-size="11" font-weight="bold" fill="#C0392B">26%</text>
  <text x="253" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#C0392B">15%</text>
  <text x="425" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#C0392B">8%</text>
  <text x="771" y="311" text-anchor="middle" font-size="11" font-weight="bold" fill="#C0392B">~4%</text>
  <text x="825" y="318" text-anchor="start" font-size="11" font-weight="bold" fill="#C0392B">3%</text>
  <!-- X-axis ticks -->
  <line x1="80" y1="330" x2="80" y2="337" stroke="#999"/>
  <line x1="105" y1="330" x2="105" y2="337" stroke="#999"/>
  <line x1="253" y1="330" x2="253" y2="337" stroke="#999"/>
  <line x1="425" y1="330" x2="425" y2="337" stroke="#999"/>
  <line x1="771" y1="330" x2="771" y2="337" stroke="#999"/>
  <line x1="820" y1="330" x2="820" y2="337" stroke="#999"/>
  <!-- X-axis labels -->
  <text x="80" y="352" text-anchor="middle" font-size="11" fill="#555">Day 0</text>
  <text x="105" y="352" text-anchor="middle" font-size="11" fill="#555">Day 1</text>
  <text x="253" y="352" text-anchor="middle" font-size="11" fill="#555">Day 7</text>
  <text x="425" y="352" text-anchor="middle" font-size="11" fill="#555">Day 14</text>
  <text x="771" y="352" text-anchor="middle" font-size="11" fill="#555">Day 28</text>
  <text x="820" y="352" text-anchor="middle" font-size="11" fill="#555">Day 30</text>
  <!-- X-axis label -->
  <text x="450" y="378" text-anchor="middle" font-size="12" fill="#444">Days Since Installation</text>
  <!-- Annotation -->
  <rect x="155" y="130" width="248" height="44" fill="white" stroke="#C0392B" stroke-width="1" rx="3" opacity="0.95"/>
  <text x="279" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#C0392B">Day 30 average: 3–4% retention</text>
  <text x="279" y="167" text-anchor="middle" font-size="10" fill="#555">Unchanged despite US$25B annual investment</text>
  <!-- Axes -->
  <line x1="80" y1="50" x2="80" y2="330" stroke="#AAAAAA" stroke-width="1"/>
  <line x1="80" y1="330" x2="820" y2="330" stroke="#AAAAAA" stroke-width="1"/>
  <!-- Source -->
  <text x="430" y="405" text-anchor="middle" font-size="10" fill="#999">Source: Business of Apps (2024)</text>
</svg>
