<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460" font-family="Georgia, 'Times New Roman', serif">

  <rect width="860" height="460" fill="#fafaf8"/>

  <text x="430" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Two Distinct User Cohorts — Why One Design Cannot Serve Both</text>
  <text x="430" y="54" text-anchor="middle" font-size="11.5" fill="#777" font-style="italic">Current dietary tracking tools conflate these cohorts, causing harm to the second group</text>
  <line x1="40" y1="66" x2="820" y2="66" stroke="#ddd" stroke-width="1"/>

  <!-- COHORT 1 -->
  <rect x="40" y="88" width="360" height="300" rx="8" fill="#fff" stroke="#3498db" stroke-width="2"/>
  <rect x="40" y="88" width="360" height="50" rx="8" fill="#3498db"/>
  <rect x="40" y="120" width="360" height="18" fill="#3498db"/>
  <text x="220" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">COHORT A — General Population</text>
  <text x="220" y="130" text-anchor="middle" font-size="10" fill="#d0e8ff">Estimated: ~85–90% of dietary app users</text>

  <text x="60" y="162" font-size="11" font-weight="bold" fill="#2471a3">Primary failure mode</text>
  <text x="60" y="178" font-size="11" fill="#333">Tracking friction → low Ability in Fogg B=MAP</text>
  <text x="60" y="193" font-size="11" fill="#333">Manual logging destroys motivation within days</text>

  <text x="60" y="222" font-size="11" font-weight="bold" fill="#2471a3">What they need</text>
  <text x="60" y="238" font-size="11" fill="#333">Frictionless, immediate post-meal feedback</text>
  <text x="60" y="253" font-size="11" fill="#333">Closes the phenomenological silence</text>
  <text x="60" y="268" font-size="11" fill="#333">Amplifies natural satiety signals</text>

  <text x="60" y="297" font-size="11" font-weight="bold" fill="#2471a3">Risk from punitive tools</text>
  <text x="60" y="313" font-size="11" fill="#555">Drop-out (3% Day 30 retention)</text>
  <text x="60" y="328" font-size="11" fill="#555">Mild frustration / disengagement</text>

  <rect x="56" y="348" width="328" height="28" rx="4" fill="#ebf5fb"/>
  <text x="220" y="366" text-anchor="middle" font-size="11" fill="#2471a3">Design answer: reduce friction + add immediacy</text>

  <!-- COHORT 2 -->
  <rect x="460" y="88" width="360" height="300" rx="8" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <rect x="460" y="88" width="360" height="50" rx="8" fill="#c0392b"/>
  <rect x="460" y="120" width="360" height="18" fill="#c0392b"/>
  <text x="640" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">COHORT B — ED-Risk Users</text>
  <text x="640" y="130" text-anchor="middle" font-size="10" fill="#ffd0d0">Estimated: ~10–15% of dietary app users</text>

  <text x="480" y="162" font-size="11" font-weight="bold" fill="#8b0000">Primary failure mode</text>
  <text x="480" y="178" font-size="11" fill="#333">Active harm — not disengagement</text>
  <text x="480" y="193" font-size="11" fill="#333">Intensive logging triggers disordered cognition</text>

  <text x="480" y="222" font-size="11" font-weight="bold" fill="#8b0000">What they need</text>
  <text x="480" y="238" font-size="11" fill="#333">Non-evaluative, non-comparative feedback</text>
  <text x="480" y="253" font-size="11" fill="#333">Protects interoceptive authority</text>
  <text x="480" y="268" font-size="11" fill="#333">No scores, no calories, no "good/bad"</text>

  <text x="480" y="297" font-size="11" font-weight="bold" fill="#8b0000">Risk from punitive tools</text>
  <text x="480" y="313" font-size="11" fill="#555">73% of ED users: MFP worsened condition</text>
  <text x="480" y="328" font-size="11" fill="#555">NHS admissions ↑ 8.5× 2013–2021</text>

  <rect x="476" y="348" width="328" height="28" rx="4" fill="#fdf2f2"/>
  <text x="640" y="366" text-anchor="middle" font-size="11" fill="#c0392b">Design answer: eliminate all evaluative metrics</text>

  <!-- CENTRE SEPARATOR -->
  <text x="430" y="230" text-anchor="middle" font-size="24" fill="#bbb">↔</text>
  <text x="430" y="252" text-anchor="middle" font-size="10" fill="#bbb" font-style="italic">conflated</text>
  <text x="430" y="266" text-anchor="middle" font-size="10" fill="#bbb" font-style="italic">by current</text>
  <text x="430" y="280" text-anchor="middle" font-size="10" fill="#bbb" font-style="italic">tools</text>

  <!-- BOTTOM UNIFYING STATEMENT -->
  <rect x="40" y="410" width="780" height="36" rx="6" fill="#1a1a1a"/>
  <text x="430" y="433" text-anchor="middle" font-size="11" fill="#fff">The REFLECTIVE Framework is designed to serve <tspan font-weight="bold">both</tspan> cohorts simultaneously — by eliminating every evaluative metric.</text>

  <text x="430" y="455" text-anchor="middle" font-size="9.5" fill="#aaa" font-style="italic">Sources: Phelan et al. (2020); Roth et al. (2024); NHS England (2023); Business of Apps (2024)</text>

</svg>
