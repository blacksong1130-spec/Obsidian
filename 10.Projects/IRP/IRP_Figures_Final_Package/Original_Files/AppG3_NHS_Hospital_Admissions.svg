<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="860" height="420" fill="#FAFAFA" rx="4"/>
  <!-- Title -->
  <text x="430" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#2C3E50">G3 — NHS Hospital Admissions for Eating Disorders (2013–2021)</text>
  <!-- Y-axis gridlines: max 25000, step 5000 → (5000/25000)*280=56px per step -->
  <!-- y = 330 - (value/25000)*280 -->
  <!-- 5k: y=330-56=274, 10k: y=330-112=218, 15k: y=330-168=162, 20k: y=330-224=106, 25k: y=330-280=50 -->
  <line x1="80" y1="274" x2="820" y2="274" stroke="#E5E5E5" stroke-dasharray="5,4"/>
  <line x1="80" y1="218" x2="820" y2="218" stroke="#E5E5E5" stroke-dasharray="5,4"/>
  <line x1="80" y1="162" x2="820" y2="162" stroke="#E5E5E5" stroke-dasharray="5,4"/>
  <line x1="80" y1="106" x2="820" y2="106" stroke="#E5E5E5" stroke-dasharray="5,4"/>
  <line x1="80" y1="50" x2="820" y2="50" stroke="#E5E5E5" stroke-dasharray="5,4"/>
  <!-- Y-axis labels -->
  <text x="72" y="278" text-anchor="end" font-size="10" fill="#666">5,000</text>
  <text x="72" y="222" text-anchor="end" font-size="10" fill="#666">10,000</text>
  <text x="72" y="166" text-anchor="end" font-size="10" fill="#666">15,000</text>
  <text x="72" y="110" text-anchor="end" font-size="10" fill="#666">20,000</text>
  <text x="72" y="54" text-anchor="end" font-size="10" fill="#666">25,000</text>
  <!-- Y-axis rotated label -->
  <text transform="rotate(-90)" x="-190" y="22" text-anchor="middle" font-size="12" fill="#444">Hospital Admissions (England)</text>
  <!-- 3 bars: slot width = 740/3 = 247, bar width = 140, gaps = 107 -->
  <!-- Centers at: 80+123=203, 80+370=450, 80+617=697 -->
  <!-- 2013/14: 2868 → h=(2868/25000)*280=32.1, y_top=330-32.1=297.9 -->
  <rect x="133" y="298" width="140" height="32" fill="#2E86C1" rx="2"/>
  <!-- 2015/16: 13200 → h=(13200/25000)*280=147.8, y_top=330-147.8=182.2 -->
  <rect x="380" y="182" width="140" height="148" fill="#E67E22" rx="2"/>
  <!-- 2020/21: 24300 → h=(24300/25000)*280=272.2, y_top=330-272.2=57.8 -->
  <rect x="627" y="58" width="140" height="272" fill="#C0392B" rx="2"/>
  <!-- Bar labels (inside or above bars) -->
  <text x="203" y="293" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E86C1">2,868</text>
  <text x="450" y="177" text-anchor="middle" font-size="11" font-weight="bold" fill="#E67E22">13,200</text>
  <text x="697" y="53" text-anchor="middle" font-size="12" font-weight="bold" fill="#C0392B">24,300</text>
  <!-- % change annotations -->
  <text x="450" y="162" text-anchor="middle" font-size="10" fill="#E67E22">+360% vs. 2013</text>
  <text x="697" y="40" text-anchor="middle" font-size="10" font-weight="bold" fill="#C0392B">+747% vs. 2013 (8.5× increase)</text>
  <!-- Arrow connecting bars to show trend -->
  <line x1="273" y1="282" x2="380" y2="210" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="520" y1="170" x2="627" y2="120" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- X-axis labels -->
  <text x="203" y="348" text-anchor="middle" font-size="12" fill="#555">2013/14</text>
  <text x="203" y="363" text-anchor="middle" font-size="10" fill="#888">Baseline</text>
  <text x="450" y="348" text-anchor="middle" font-size="12" fill="#555">2015/16</text>
  <text x="697" y="348" text-anchor="middle" font-size="12" fill="#555">2020/21</text>
  <!-- X-axis label -->
  <text x="450" y="383" text-anchor="middle" font-size="12" fill="#444">Financial Year</text>
  <!-- Axes -->
  <line x1="80" y1="50" x2="80" y2="330" stroke="#AAAAAA" stroke-width="1"/>
  <line x1="80" y1="330" x2="820" y2="330" stroke="#AAAAAA" stroke-width="1"/>
  <!-- Source -->
  <text x="430" y="405" text-anchor="middle" font-size="10" fill="#999">Source: NHS England (2023). Note: correlation only — causation not established.</text>
</svg>
