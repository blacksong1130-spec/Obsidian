<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" font-family="'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1000" height="680" fill="#f8f6f2"/>

  <!-- Header band -->
  <rect x="0" y="0" width="1000" height="54" fill="#1a1a1a"/>
  <text x="40" y="22" font-size="10" fill="#999" letter-spacing="2" font-weight="300">THE AFTER GLOW  ·  DESIGN SPECIFICATION  ·  APPENDIX F</text>
  <text x="40" y="40" font-size="14" fill="#fff" font-weight="600" letter-spacing="1">Critical Artefact — Dietary Feedback Device, 2035</text>
  <text x="960" y="34" text-anchor="end" font-size="11" fill="#888">Unfired porous clay  ·  Ø80mm × 12mm</text>

  <!-- ========================= VIEW 1: TOP VIEW ========================= -->
  <text x="170" y="88" text-anchor="middle" font-size="10" fill="#888" letter-spacing="2">PLAN VIEW  (1:1)</text>

  <!-- outer disc shadow -->
  <ellipse cx="172" cy="242" rx="101" ry="19" fill="#0002" transform="rotate(-2,172,242)"/>
  <!-- outer disc body -->
  <ellipse cx="170" cy="228" rx="102" ry="22" fill="#c8b49a"/>
  <!-- top face - textured clay look -->
  <ellipse cx="170" cy="215" rx="102" ry="22" fill="#dfd0b8"/>
  <!-- inner texture rings (porous clay) -->
  <ellipse cx="170" cy="215" rx="80" ry="17" fill="none" stroke="#c4ae90" stroke-width="0.5" opacity="0.6"/>
  <ellipse cx="170" cy="215" rx="60" ry="13" fill="none" stroke="#c4ae90" stroke-width="0.5" opacity="0.5"/>
  <!-- LED aperture - amber glow -->
  <ellipse cx="170" cy="215" rx="34" ry="8" fill="#f0e8d8"/>
  <ellipse cx="170" cy="215" rx="28" ry="6.5" fill="#ffd280" opacity="0.7"/>
  <ellipse cx="170" cy="215" rx="18" ry="4.2" fill="#ffb830" opacity="0.85"/>
  <ellipse cx="170" cy="215" rx="10" ry="2.5" fill="#ff9800"/>
  <!-- glow radiance -->
  <ellipse cx="170" cy="215" rx="60" ry="16" fill="#ffa500" opacity="0.06"/>
  <ellipse cx="170" cy="215" rx="90" ry="20" fill="#ffa500" opacity="0.03"/>
  <!-- clay texture dots -->
  <circle cx="140" cy="210" r="1" fill="#bba080" opacity="0.4"/>
  <circle cx="155" cy="208" r="0.8" fill="#bba080" opacity="0.3"/>
  <circle cx="198" cy="212" r="1" fill="#bba080" opacity="0.35"/>
  <circle cx="185" cy="220" r="0.7" fill="#bba080" opacity="0.3"/>
  <circle cx="148" cy="223" r="0.9" fill="#bba080" opacity="0.35"/>

  <!-- Dimension lines & annotations -->
  <!-- Diameter line -->
  <line x1="68" y1="215" x2="68" y2="180" stroke="#555" stroke-width="0.7"/>
  <line x1="272" y1="215" x2="272" y2="180" stroke="#555" stroke-width="0.7"/>
  <line x1="68" y1="184" x2="272" y2="184" stroke="#555" stroke-width="0.7" marker-start="url(#arr)" marker-end="url(#arr2)"/>
  <text x="170" y="178" text-anchor="middle" font-size="10" fill="#444">Ø 80 mm</text>

  <!-- LED aperture dim -->
  <line x1="142" y1="240" x2="198" y2="240" stroke="#b07000" stroke-width="0.6" stroke-dasharray="3,2"/>
  <text x="170" y="255" text-anchor="middle" font-size="9" fill="#b07000">amber aperture Ø 28mm</text>

  <!-- Annotation: No screen -->
  <line x1="272" y1="205" x2="310" y2="190" stroke="#666" stroke-width="0.8"/>
  <text x="315" y="188" font-size="10" fill="#333">No screen. No number.</text>
  <text x="315" y="202" font-size="10" fill="#333">Only light + warmth.</text>

  <!-- Annotation: porous clay -->
  <line x1="100" y1="220" x2="62" y2="235" stroke="#666" stroke-width="0.8"/>
  <text x="20" y="240" font-size="10" fill="#6a4a20">Unfired porous clay</text>
  <text x="20" y="253" font-size="10" fill="#6a4a20">(degrades over time)</text>

  <!-- ========================= VIEW 2: SIDE / SECTION VIEW ========================= -->
  <text x="560" y="88" text-anchor="middle" font-size="10" fill="#888" letter-spacing="2">SECTION A–A  (2:1)</text>

  <!-- cross-section body -->
  <rect x="410" y="130" width="300" height="46" rx="23" fill="#dfd0b8" stroke="#9a7a56" stroke-width="1.5"/>
  <!-- section fill hatching (clay) -->
  <clipPath id="discClip"><rect x="410" y="130" width="300" height="46" rx="23"/></clipPath>
  <g clip-path="url(#discClip)" opacity="0.25">
    <line x1="410" y1="136" x2="714" y2="136" stroke="#7a5a38" stroke-width="0.5"/>
    <line x1="410" y1="142" x2="714" y2="142" stroke="#7a5a38" stroke-width="0.5"/>
    <line x1="410" y1="148" x2="714" y2="148" stroke="#7a5a38" stroke-width="0.5"/>
    <line x1="410" y1="154" x2="714" y2="154" stroke="#7a5a38" stroke-width="0.5"/>
    <line x1="410" y1="160" x2="714" y2="160" stroke="#7a5a38" stroke-width="0.5"/>
    <line x1="410" y1="166" x2="714" y2="166" stroke="#7a5a38" stroke-width="0.5"/>
    <line x1="410" y1="172" x2="714" y2="172" stroke="#7a5a38" stroke-width="0.5"/>
  </g>

  <!-- Internal components -->
  <!-- Biosensor module (right side) -->
  <rect x="634" y="140" width="48" height="26" rx="3" fill="#d0e8f8" stroke="#4a8ab8" stroke-width="1"/>
  <text x="658" y="150" text-anchor="middle" font-size="7.5" fill="#2a5a88">BIO</text>
  <text x="658" y="161" text-anchor="middle" font-size="7.5" fill="#2a5a88">SENSOR</text>

  <!-- Thermal actuator (center) -->
  <rect x="525" y="142" width="50" height="22" rx="3" fill="#ffe8c0" stroke="#c87000" stroke-width="1"/>
  <text x="550" y="151" text-anchor="middle" font-size="7.5" fill="#8a5000">THERMAL</text>
  <text x="550" y="161" text-anchor="middle" font-size="7.5" fill="#8a5000">ACTUATOR</text>

  <!-- LED module (left-center) -->
  <ellipse cx="462" cy="153" rx="26" ry="11" fill="#fff3cc" stroke="#e09000" stroke-width="1"/>
  <ellipse cx="462" cy="153" rx="16" ry="7" fill="#ffcc44" opacity="0.8"/>
  <text x="462" y="157" text-anchor="middle" font-size="7.5" fill="#7a5000">LED</text>

  <!-- Thickness dimension -->
  <line x1="720" y1="130" x2="750" y2="130" stroke="#555" stroke-width="0.7"/>
  <line x1="720" y1="176" x2="750" y2="176" stroke="#555" stroke-width="0.7"/>
  <line x1="738" y1="130" x2="738" y2="176" stroke="#555" stroke-width="0.7"/>
  <text x="745" y="157" font-size="10" fill="#444">12 mm</text>

  <!-- Section label -->
  <text x="420" y="126" font-size="10" fill="#888">A</text>
  <text x="700" y="126" font-size="10" fill="#888">A</text>

  <!-- Component annotation lines -->
  <line x1="462" y1="142" x2="462" y2="110" stroke="#e09000" stroke-width="0.8"/>
  <text x="462" y="106" text-anchor="middle" font-size="10" fill="#c87000">Amber LED array</text>

  <line x1="550" y1="142" x2="550" y2="110" stroke="#c87000" stroke-width="0.8"/>
  <text x="550" y="106" text-anchor="middle" font-size="10" fill="#8a5000">Thermal actuator</text>

  <line x1="658" y1="140" x2="658" y2="110" stroke="#4a8ab8" stroke-width="0.8"/>
  <text x="658" y="106" text-anchor="middle" font-size="10" fill="#2a5a88">Wearable-linked sensor</text>

  <!-- Bottom annotations -->
  <text x="420" y="200" font-size="10" fill="#6a4a20">Surface: rough, organic texture</text>
  <text x="420" y="214" font-size="10" fill="#6a4a20">No glaze. Porous. Retains heat &amp; scent.</text>
  <text x="420" y="228" font-size="10" fill="#888">Activation: hold in both hands, 60 seconds post-meal</text>

  <!-- ========================= VIEW 3: HANDS USAGE SCENE ========================= -->
  <text x="170" y="320" text-anchor="middle" font-size="10" fill="#888" letter-spacing="2">USAGE — 60-SECOND ACTIVATION</text>

  <!-- Left hand (simplified) -->
  <path d="M 60,490 Q 55,430 75,400 Q 85,385 100,390 Q 115,375 120,390 Q 132,378 136,392 Q 148,382 150,396 Q 165,390 165,410 Q 165,430 160,450 L 155,490 Z" fill="#f0c8a0" stroke="#c8956a" stroke-width="1.2"/>
  <!-- thumb -->
  <path d="M 75,400 Q 60,395 58,415 Q 56,430 68,435 Q 72,450 75,455" fill="#f0c8a0" stroke="#c8956a" stroke-width="1"/>
  <!-- palm details -->
  <path d="M 95,430 Q 100,440 105,455 Q 110,470 115,490" fill="none" stroke="#d8a880" stroke-width="0.6"/>
  <path d="M 115,430 Q 118,450 120,490" fill="none" stroke="#d8a880" stroke-width="0.5"/>

  <!-- Right hand (mirrored) -->
  <path d="M 280,490 Q 285,430 265,400 Q 255,385 240,390 Q 225,375 220,390 Q 208,378 204,392 Q 192,382 190,396 Q 175,390 175,410 Q 175,430 180,450 L 185,490 Z" fill="#f0c8a0" stroke="#c8956a" stroke-width="1.2"/>
  <!-- right thumb -->
  <path d="M 265,400 Q 280,395 282,415 Q 284,430 272,435 Q 268,450 265,455" fill="#f0c8a0" stroke="#c8956a" stroke-width="1"/>

  <!-- Disc resting in cupped hands -->
  <ellipse cx="170" cy="430" rx="76" ry="17" fill="#c8b49a" opacity="0.6"/>
  <ellipse cx="170" cy="420" rx="76" ry="17" fill="#dfd0b8"/>
  <!-- top glow -->
  <ellipse cx="170" cy="420" rx="55" ry="12" fill="#f0e8d8"/>
  <ellipse cx="170" cy="420" rx="40" ry="9" fill="#ffd280" opacity="0.8"/>
  <ellipse cx="170" cy="420" rx="24" ry="5.5" fill="#ffb830" opacity="0.9"/>
  <ellipse cx="170" cy="420" rx="13" ry="3" fill="#ff9800"/>
  <!-- glow radiance / warmth halo -->
  <ellipse cx="170" cy="415" rx="95" ry="50" fill="#ffa500" opacity="0.04"/>
  <ellipse cx="170" cy="415" rx="70" ry="36" fill="#ffa500" opacity="0.06"/>

  <!-- Warmth rays (radiating outward) -->
  <line x1="120" y1="395" x2="105" y2="374" stroke="#ffa030" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.6"/>
  <line x1="170" y1="390" x2="170" y2="366" stroke="#ffa030" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.6"/>
  <line x1="220" y1="395" x2="235" y2="374" stroke="#ffa030" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.6"/>
  <line x1="100" y1="416" x2="76" y2="410" stroke="#ffa030" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.5"/>
  <line x1="240" y1="416" x2="264" y2="410" stroke="#ffa030" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.5"/>

  <!-- Timer arc (60-second) -->
  <path d="M170,356 A38,38 0 1,1 131,383" fill="none" stroke="#ffa030" stroke-width="2" opacity="0.5"/>
  <text x="170" y="354" text-anchor="middle" font-size="9" fill="#c87000">60 sec</text>

  <!-- Annotations -->
  <line x1="270" y1="420" x2="330" y2="410" stroke="#555" stroke-width="0.8"/>
  <text x="335" y="408" font-size="10" fill="#333">Both palms hold disc</text>
  <text x="335" y="422" font-size="10" fill="#333">Heat transfers upward</text>
  <text x="335" y="436" font-size="10" fill="#333">into hands as feedback</text>

  <line x1="170" y1="366" x2="335" y2="355" stroke="#c87000" stroke-width="0.8"/>
  <text x="338" y="353" font-size="10" fill="#c87000">Soft amber glow (no number)</text>
  <text x="338" y="367" font-size="10" fill="#c87000">intensity ∝ metabolic response</text>

  <!-- ========================= VIEW 4: THREE PROVOCATIONS ========================= -->
  <text x="660" y="305" text-anchor="middle" font-size="10" fill="#888" letter-spacing="2">THREE CRITICAL PROVOCATIONS</text>

  <!-- Provocation 1 box -->
  <rect x="450" y="318" width="420" height="72" rx="4" fill="#fff" stroke="#c0392b" stroke-width="1.2"/>
  <rect x="450" y="318" width="6" height="72" rx="2" fill="#c0392b"/>
  <text x="468" y="337" font-size="11" font-weight="bold" fill="#c0392b">① Surveillance Blackout</text>
  <text x="468" y="354" font-size="10" fill="#444">Severs Wi-Fi + disables smart speakers during 60-second window.</text>
  <text x="468" y="368" font-size="10" fill="#444">The price of reflection = disconnecting from data surveillance.</text>
  <text x="468" y="382" font-size="9" fill="#888" font-style="italic">Ref: DIS 2025 "Wall" probe; Wallace et al. (2025)</text>

  <!-- Provocation 2 box -->
  <rect x="450" y="402" width="420" height="72" rx="4" fill="#fff" stroke="#e67e22" stroke-width="1.2"/>
  <rect x="450" y="402" width="6" height="72" rx="2" fill="#e67e22"/>
  <text x="468" y="421" font-size="11" font-weight="bold" fill="#e67e22">② Intentional Placebo Error</text>
  <text x="468" y="438" font-size="10" fill="#444">1-in-10 activations: disc stays cold and dark — or emits wrong signal.</text>
  <text x="468" y="452" font-size="10" fill="#444">Forces user to ask: does the body know, or does the machine?</text>
  <text x="468" y="466" font-size="9" fill="#888" font-style="italic">Ref: Dunne &amp; Raby (2001) Placebo Project; Makhortykh et al. (2022)</text>

  <!-- Provocation 3 box -->
  <rect x="450" y="486" width="420" height="72" rx="4" fill="#fff" stroke="#7a5c3a" stroke-width="1.2"/>
  <rect x="450" y="486" width="6" height="72" rx="2" fill="#7a5c3a"/>
  <text x="468" y="505" font-size="11" font-weight="bold" fill="#7a5c3a">③ Programmed Physical Decay</text>
  <text x="468" y="522" font-size="10" fill="#444">Unfired clay cracks under rushed meals. Degrades, stains, crumbles over months.</text>
  <text x="468" y="536" font-size="10" fill="#444">Silicon promises immortal optimisation. Clay insists on entropy.</text>
  <text x="468" y="550" font-size="9" fill="#888" font-style="italic">See: AppF3 — Physical Decay Timeline</text>

  <!-- ========================= SPEC SUMMARY ========================= -->
  <rect x="450" y="576" width="420" height="72" rx="4" fill="#1a1a1a"/>
  <text x="660" y="598" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">REFLECTIVE Framework Compliance</text>
  <text x="660" y="616" text-anchor="middle" font-size="10" fill="#ccc">Descriptive, not Evaluative  ·  Relative, not Absolute  ·  Closed-Loop, not Open-Ended</text>
  <text x="660" y="632" text-anchor="middle" font-size="10" fill="#aaa">No score.  No number.  No comparison.  No persistent monitoring.</text>
  <text x="660" y="648" text-anchor="middle" font-size="9" fill="#666">Source: Tribole &amp; Resch (2020); Fogg (2009); Zeevi et al. (2015) — See full spec in Appendix F</text>

  <!-- ========================= FOOTER ========================= -->
  <rect x="0" y="662" width="1000" height="18" fill="#eee8dc"/>
  <text x="40" y="675" font-size="9" fill="#888">Weijie Li  ·  IRP Proposal  ·  Design Futures, Royal College of Art  ·  May 2026</text>
  <text x="960" y="675" text-anchor="end" font-size="9" fill="#888">AppF1 — After Glow Design Specification</text>

  <!-- Arrowhead markers (reusable) -->
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M6,0 L6,6 L0,3 z" fill="#555"/>
    </marker>
    <marker id="arr2" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#555"/>
    </marker>
  </defs>

</svg>
